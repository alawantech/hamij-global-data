name: Deploy Guchor Data

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GUCHOR_SERVER_HOST }}
          username: ${{ secrets.GUCHOR_SERVER_USER }}
          key: ${{ secrets.GUCHOR_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/guchor-monie
            git pull origin main
            cd backend
            npx prisma db push --skip-generate && npx prisma generate
            cd ../frontend
            npm run build
            cd ..
            pm2 restart guchor-backend
            pm2 restart frontend
            echo "=== Deploy Complete ==="
            pm2 list
